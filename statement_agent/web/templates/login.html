<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Statement Intelligence Agent</title>
<style>
  /* Same tokens as index.html, including the --field-line border that meets 1.4.11, so the sign-in
     page is held to the contrast and focus rules the rest of the app was checked against. */
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --ink: #1b1c1e; --muted: #4f535a; --line: #cfccc3;
    --field-line: #83868c; --accent: #1d5a86; --accent-ink: #ffffff;
    --bad: #9f2328; --bad-soft: #f9e4e4; --focus: #b0540b; --radius: 12px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --surface: #1d1f22; --ink: #f1f0ec; --muted: #b9bcc2; --line: #3d4147;
      --field-line: #727781; --accent: #8cc2ea; --accent-ink: #0d1b26;
      --bad: #f3a3a6; --bad-soft: #3d1f21; --focus: #ffb870; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 112.5%; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
    background: var(--bg); color: var(--ink); line-height: 1.55;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  main { width: 100%; max-width: 26rem; }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 0.3rem; }
  p { margin: 0 0 1rem; color: var(--muted); }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.3rem; }
  input[type="password"] {
    font: inherit; width: 100%; min-height: 48px; padding: 0.4rem 0.6rem;
    border: 1px solid var(--field-line); border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  button {
    margin-top: 1rem; width: 100%; min-height: 48px; font: inherit; font-weight: 600; cursor: pointer;
    border: 2px solid var(--accent); border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  }
  .error { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 0.7rem 0.9rem; margin: 0 0 1rem; font-weight: 600; }
  .note { font-size: 0.92rem; }
</style>
</head>
<body>
  <main>
    <h1>Statement Intelligence Agent</h1>
    <p>This is a private ledger. Enter the passphrase to continue.</p>
    <form method="post" action="/login">
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <label for="passphrase">Passphrase</label>
      <input id="passphrase" name="passphrase" type="password" autocomplete="current-password"
             autofocus required {% if not configured %}disabled{% endif %}>
      <button type="submit" {% if not configured %}disabled{% endif %}>Sign in</button>
      {% if not configured %}
        <p class="note" style="margin-top:1rem">
          No passphrase has been set. Run <code>python -m statement_agent.cli set-passphrase</code>
          on the server, then reload this page.
        </p>
      {% endif %}
    </form>
  </main>
</body>
</html>
