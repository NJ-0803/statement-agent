[pytest]
testpaths = tests
# Tests run across 4 processes by default: the suite is ~5s of work and pytest itself costs ~1.2s to
# start, so 4 is the sweet spot on a laptop (8 workers thrash on 8GB). Override with `-n 0` or `-n auto`.
# loadfile keeps each file's tests on one worker, so session fixtures (the shared dataset ledger) are
# built once per worker rather than fought over.
addopts = -n 4 --dist loadfile
